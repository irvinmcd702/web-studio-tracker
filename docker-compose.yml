services:
  postgres:
    image: postgres:16-alpine
    container_name: studio-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: studio_tracker
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d studio_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
